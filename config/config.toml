[path_planning_params]
maximum_duration_millis = 1000 # i.e., T = Maximum duration of the algorithm in milliseconds
discrete_steps_count = 1000      # i.e., t = Total number of discrete time steps
starting_position = [20, 20]     # i.e, (x,y) = Index of drone starting position

[map_params]
replenish_rate = 0 # i.e., the rate at which already-visited cells are replenished to their original value, per step
map_file_path = "./grids/100.txt"